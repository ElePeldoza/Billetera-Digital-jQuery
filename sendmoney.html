<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enviar Dinero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 shadow">

            <h2 class="text-center mb-4">Enviar Dinero</h2>

          

            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#contactoModal">
                Agregar nuevo contacto
            </button>

                <input
                        type="text"
                        id="buscarContacto"
                        class="form-control mt-3"
                        placeholder="Buscar contacto">

            <select id="listaContactos" class="form-select mt-3"></select>
                    <input
                        type="number"
                        id="montoEnviar"
                        class="form-control mt-3"
                        placeholder="Monto a enviar">

            <button type="button" id="btnEnviarDinero" class="btn btn-primary mt-3">
                Enviar Dinero
            </button>

            <div id="mensajeTransferencia" class="mt-3"></div>
            <a href="menu.html" class="btn btn-secondary mt-3">
                Volver al Menú
            </a>

        </div>
    </div>

    <!-- Modal -->

    <div class="modal fade" id="contactoModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Nuevo Contacto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="formAgregarContacto">

                        <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre">
                        <input type="text" id="cbu" class="form-control mb-2" placeholder="CBU">
                        <input type="text" id="alias" class="form-control mb-2" placeholder="Alias">
                        <input type="text" id="banco" class="form-control mb-2" placeholder="Banco">
                    
                        <div id="mensajeContacto"></div>

                        <button
                            type="submit"
                            class="btn btn-success">
                            Guardar
                        </button>

                    </form>

                 </div>
            </div>
        </div>
    </div>

    
<!-- agrego el cnd js de boostrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<!-- agrego el codigo de jquery--> 
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- agrego mi script js-->
<script src="JSS/script.js"></script>
    
   
</body>

</html>
