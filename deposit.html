<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Depósito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 shadow">
            
            <h2 class="text-center mb-4">Depositar</h2>

                <div class="alert alert-info">
                    Saldo actual:
                    <strong id="saldoActual"></strong>
                </div>
           <form id="formDeposito">
                <div class="mb-3">
                    <label class="form-label">Monto a depositar</label>
                    <input type="number" id="montoDepositar" class="form-control">
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Realizar depósito
                </button>
            </form>

            <div id="alert-container"></div>

            <div id="mensajeDeposito"></div>

            <a href="menu.html" class="btn btn-secondary mt-3">
                Volver al Menú
            </a>

        </div>
    </div>


    <!-- agrego el cnd js de boostrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <!-- agrego el codigo de jquery-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- agrego mi script js-->
    <script src="JSS/script.js"></script>

</body>

</html>
